name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Prepare the static bundle
        run: |
          mkdir -p dist
          cp index.html styles.css sw.js manifest.webmanifest .nojekyll dist/
          cp -r js dist/js
          cp -r icons dist/icons
          cp README.md dist/
          # Fail loudly here rather than publishing a site with no JavaScript.
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/js/main.js

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
