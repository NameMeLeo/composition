name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Compile TypeScript (src -> dist/js)
        run: npm run build

      - name: Prepare the static bundle
        run: |
          cp index.html styles.css sw.js manifest.webmanifest .nojekyll dist/
          cp -r icons dist/icons
          cp -r assets dist/assets
          cp README.md dist/
          # Fail loudly here rather than publishing a site with no JavaScript.
          test -f dist/index.html
          test -f dist/sw.js
          test -f dist/js/main.js
          test -f dist/assets/report/tc/bg.png
          test -f dist/assets/report/en/bg.png
          test -f dist/assets/report/sc/bg.png

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
